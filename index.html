<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Merici &amp; David's Wedding</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖤</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { font:15px "DM Sans", sans-serif; background:#fff; color:#2C2A26; line-height:1.6; -webkit-font-smoothing:antialiased; }
  :root { --terra:#551C25; --gold:#D4A843; --cream:#F6EEDF; --ink:#2C2A26; --ink-soft:#5C5650; --border:#E4DCC9; }
  a { color:var(--terra); }
  a:hover { color:#7d5411; }
  input:focus-visible, button:focus-visible, a:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }

  .page { display:none; }
  .page.active { display:flex; justify-content:center; min-height:100vh; min-height:100dvh; }
  .wrap { width:100%; max-width:480px; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; background:#fff; }

  .tile-band { background-color:var(--terra); background-image:
      repeating-linear-gradient(45deg, rgba(246,238,223,.10) 0 1px, transparent 1px 17px),
      repeating-linear-gradient(-45deg, rgba(246,238,223,.10) 0 1px, transparent 1px 17px),
      radial-gradient(circle at 50% 50%, rgba(212,168,67,.30) 2px, transparent 2.1px);
    background-size:34px 34px, 34px 34px, 34px 34px; }

  /* Welcome / login */
  #welcomePage .wrap { padding:28px 24px 40px; overflow-y:auto; }
  .lang-pills { display:flex; gap:6px; justify-content:center; flex-shrink:0; }
  .lang-pill { padding:7px 16px; border-radius:999px; border:1px solid rgba(246,238,223,.35); background:transparent; color:rgba(246,238,223,.7); font:600 12px "DM Sans",sans-serif; letter-spacing:.1em; cursor:pointer; }
  .lang-pill.active { border-color:var(--gold); background:rgba(212,168,67,.22); color:var(--cream); }
  .welcome-hero { flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:16px 0; }
  .welcome-kicker { font:400 13px "DM Sans",sans-serif; letter-spacing:.28em; text-transform:uppercase; color:var(--gold); margin-bottom:18px; }
  .welcome-hero h1 { font:300 54px "Cormorant Garamond",serif; color:var(--cream); line-height:1.0; }
  .welcome-hero h1 em { font-style:italic; font-size:40px; color:var(--gold); }
  .welcome-rule { width:1px; height:34px; background:rgba(212,168,67,.6); margin:24px auto; }
  .welcome-place { font:500 13px "DM Sans",sans-serif; letter-spacing:.2em; text-transform:uppercase; color:rgba(246,238,223,.8); }
  .welcome-dates { font:400 13px "DM Sans",sans-serif; letter-spacing:.2em; text-transform:uppercase; color:rgba(246,238,223,.55); margin-top:4px; }
  .login-card { background:#FCF8F0; border-radius:14px; padding:20px; flex-shrink:0; }
  .login-card label { display:block; font:600 11px "DM Sans",sans-serif; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:8px; }
  .login-card input { width:100%; padding:15px 14px; border:1px solid var(--border); border-radius:10px; background:#fff; font:400 16px "DM Sans",sans-serif; color:var(--ink); margin-bottom:10px; }
  .login-card button { width:100%; padding:15px; border:none; border-radius:10px; background:var(--terra); color:var(--cream); font:600 15px "DM Sans",sans-serif; cursor:pointer; }
  .login-card button:hover { background:#43161d; }
  .login-card button:disabled { opacity:.6; cursor:not-allowed; }
  .login-err { color:#c23b3b; font:400 13px "DM Sans",sans-serif; margin-bottom:10px; }
  .login-hint { font:400 12.5px "DM Sans",sans-serif; color:#8A8378; margin-top:12px; text-align:center; }

  /* Compact the login screen on short viewports so everything fits without scrolling */
  @media (max-height:700px) {
    #welcomePage .wrap { padding:16px 24px 20px; }
    .welcome-hero { padding:8px 0; }
    .welcome-kicker { margin-bottom:10px; }
    .welcome-hero h1 { font-size:38px; }
    .welcome-hero h1 em { font-size:28px; }
    .welcome-rule { height:20px; margin:14px auto; }
    .login-card { padding:14px; }
    .login-card input { padding:12px 14px; margin-bottom:8px; }
    .login-card button { padding:12px; }
    .login-hint { margin-top:8px; }
  }
  /* Very short viewports (e.g. phones in landscape) need an even tighter layout */
  @media (max-height:480px) {
    #welcomePage .wrap { padding:10px 24px 12px; }
    .welcome-hero { padding:0; }
    .welcome-kicker { margin-bottom:4px; }
    .welcome-hero h1 { font-size:26px; }
    .welcome-hero h1 em { font-size:19px; }
    .welcome-rule { height:10px; margin:6px auto; }
    .welcome-dates { margin-top:2px; }
    .login-card { padding:10px; }
    .login-card label { margin-bottom:4px; }
    .login-card input { padding:8px 12px; margin-bottom:6px; }
    .login-card button { padding:9px; }
    .login-hint { margin-top:5px; }
  }

  /* Hub header + nav */
  .hub-header { padding:16px 20px 20px; }
  .hub-header-top { display:flex; align-items:center; justify-content:space-between; }
  .hub-brand { font:600 30px "Cormorant Garamond",serif; color:var(--cream); letter-spacing:.1em; }
  .hub-brand em { font-style:italic; color:var(--gold); }
  .menu-wrap { position:relative; }
  .menu-btn { display:flex; align-items:center; gap:6px; border:1px solid rgba(246,238,223,.4); background:transparent; border-radius:999px; padding:6px 12px; cursor:pointer; font:600 11px "DM Sans",sans-serif; letter-spacing:.1em; color:var(--cream); }
  .menu-panel { position:absolute; top:calc(100% + 8px); right:0; z-index:20; width:170px; padding:6px; background:#FCF8F0; border:1px solid var(--border); border-radius:8px; box-shadow:0 12px 32px rgba(45,43,43,.22); display:none; }
  .menu-panel.open { display:block; }
  .menu-item { display:block; width:100%; text-align:left; border:none; background:transparent; padding:8px 10px; border-radius:4px; cursor:pointer; color:#3E3A34; font:400 13.5px "DM Sans",sans-serif; }
  .menu-item.active { background:rgba(85,28,37,.07); color:var(--terra); font-weight:600; }
  .menu-divider { height:1px; background:var(--border); margin:6px 0; }
  .hub-day-title { font:300 34px "Cormorant Garamond",serif; color:var(--cream); line-height:1.15; margin-top:2px; }
  .hub-day-sub { font:400 12.5px "DM Sans",sans-serif; letter-spacing:.12em; text-transform:uppercase; color:rgba(246,238,223,.65); margin-top:2px; }

  .tabs { position:sticky; top:0; z-index:5; background:var(--terra); padding:0 20px 12px; display:flex; gap:7px; box-shadow:0 6px 12px -8px rgba(45,43,43,.5); }
  .tab { flex:1; padding:9px 4px; border-radius:999px; border:1px solid rgba(246,238,223,.3); background:transparent; color:rgba(246,238,223,.75); font:600 13px "DM Sans",sans-serif; cursor:pointer; }
  .tab.active { border-color:var(--cream); background:var(--cream); color:var(--terra); }

  .day-panel { padding:22px 20px 0; display:flex; flex-direction:column; gap:16px; }
  .card { border:1px solid var(--border); border-radius:14px; background:#FCF8F0; overflow:hidden; }
  .card-head { padding:16px 18px 12px; border-bottom:1px solid #EDE6D8; display:flex; align-items:center; gap:10px; }
  .card-head.center { justify-content:center; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--gold); flex-shrink:0; }
  .card-head-title { font:700 12px "DM Sans",sans-serif; letter-spacing:.14em; text-transform:uppercase; color:var(--terra); }
  .rail { padding:14px 18px 4px; }
  .rail-label { font:600 10.5px "DM Sans",sans-serif; letter-spacing:.16em; text-transform:uppercase; color:#8A8378; margin-bottom:8px; }
  .rail-row { display:grid; grid-template-columns:50px 18px 1fr; }
  .rail-time { font:600 14px "DM Sans",sans-serif; font-variant-numeric:tabular-nums; color:var(--terra); text-align:right; padding-top:1px; }
  .rail-line { border-left:1px solid var(--border); margin-left:8px; padding-top:6px; }
  .rail-line.last { border-left:none; }
  .rail-line-dot { width:7px; height:7px; border-radius:50%; background:var(--terra); margin-left:-4px; }
  .rail-text { font:400 14.5px "DM Sans",sans-serif; color:#3E3A34; padding-bottom:14px; }
  .rail-text.last { padding-bottom:8px; }
  .fields { padding:4px 18px 18px; display:flex; flex-direction:column; gap:12px; }
  .field-label { font:600 10.5px "DM Sans",sans-serif; letter-spacing:.16em; text-transform:uppercase; color:#8A8378; margin-bottom:3px; }
  .field-value { font:400 14px "DM Sans",sans-serif; color:#3E3A34; }
  .field-value a { font-weight:500; text-decoration:underline; text-decoration-color:rgba(212,168,67,.9); text-underline-offset:3px; }
  .map-embed { position:relative; width:100%; aspect-ratio:16/10; border:1px solid var(--border); border-radius:10px; overflow:hidden; margin-bottom:8px; }
  .map-embed iframe { position:absolute; top:0; left:0; width:100%; height:100%; border:0; }
  .map-caption { font:400 14px "DM Sans",sans-serif; color:#3E3A34; }
  .notes-list { display:flex; flex-direction:column; gap:8px; }
  .notes-item { position:relative; padding-left:14px; font:400 14px "DM Sans",sans-serif; color:#3E3A34; }
  .notes-item::before { content:'•'; position:absolute; left:0; color:var(--gold); }

  .qr-card { text-align:center; }
  .qr-body { padding:22px 18px 24px; }
  .qr-note { font:400 14px "DM Sans",sans-serif; color:var(--ink-soft); margin-bottom:16px; }
  .qr-img { display:block; margin:0 auto; width:180px; height:180px; border:1px solid var(--border); border-radius:8px; background:#fff; }
  .qr-link { display:inline-block; margin-top:14px; padding:11px 22px; border:1px solid var(--terra); border-radius:999px; background:#fff; font:600 14px "DM Sans",sans-serif; color:var(--terra); text-decoration:none; }
  .qr-link:hover { background:var(--terra); color:var(--cream); }

  .footer-card { padding:20px 16px 30px; }
  .footer-inner { border:1px dashed var(--gold); border-radius:14px; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .footer-label { font:600 10.5px "DM Sans",sans-serif; letter-spacing:.16em; text-transform:uppercase; color:#8A8378; }
  .footer-name { font:500 14px "DM Sans",sans-serif; color:var(--ink); margin-top:2px; white-space:nowrap; }
  .footer-role { font:400 12px "DM Sans",sans-serif; color:var(--ink-soft); margin-top:2px; white-space:nowrap; }
  .footer-actions { flex-shrink:0; display:flex; gap:6px; }
  .thankyou-block { text-align:center; padding:36px 20px 8px; }
  .thankyou-text { font:400 46px "Cormorant Garamond",serif; color:var(--terra); }
  .call-btn { flex-shrink:0; border:1px solid var(--terra); border-radius:999px; padding:8px 12px; font:600 12px "DM Sans",sans-serif; color:var(--terra); text-decoration:none; }

  @media (max-width:400px) { .wrap { max-width:100%; } }
</style>
</head>
<body>

<div id="welcomePage" class="page">
  <div class="wrap tile-band">
    <div class="lang-pills">
      <button class="lang-pill" data-lang="en" onclick="changeLang('en')">EN</button>
      <button class="lang-pill" data-lang="es" onclick="changeLang('es')">ES</button>
      <button class="lang-pill" data-lang="pt" onclick="changeLang('pt')">PT</button>
    </div>
    <div class="welcome-hero">
      <div class="welcome-kicker" id="welcomeKicker">The Wedding</div>
      <h1>Merici<br><em id="welcomeAmp">&amp;</em><br>David</h1>
      <div class="welcome-rule"></div>
      <div class="welcome-place">Málaga</div>
      <div class="welcome-dates">11 – 13 · IX · 2026</div>
    </div>
    <div class="login-card">
      <label for="passwordInp" id="passwordLabel">Password</label>
      <input type="password" id="passwordInp" placeholder="Password" autocomplete="current-password">
      <div id="loginErr" class="login-err" role="alert" aria-live="polite" style="display:none;"></div>
      <button id="loginBtn" onclick="tryLogin()">Login</button>
      <div class="login-hint" id="langHint">Language can be changed later from the menu.</div>
    </div>
  </div>
</div>

<div id="hubPage" class="page">
  <div class="wrap">
    <div class="hub-header tile-band">
      <div class="hub-header-top">
        <div class="hub-brand">M <em>&amp;</em> D</div>
        <div class="menu-wrap">
          <button class="menu-btn" id="menuBtn" onclick="toggleMenu()"><span id="menuLangLabel">EN</span> ▾</button>
          <div class="menu-panel" id="menuPanel">
            <button class="menu-item" data-lang="en" onclick="changeLang('en')">English</button>
            <button class="menu-item" data-lang="es" onclick="changeLang('es')">Español</button>
            <button class="menu-item" data-lang="pt" onclick="changeLang('pt')">Português</button>
            <div class="menu-divider"></div>
            <button class="menu-item" id="hubLogoutBtn" onclick="logout()">Log out</button>
          </div>
        </div>
      </div>
      <div id="dayHeaderExtra" style="display:none;">
        <div class="hub-day-title" id="dayTitleExtra">Guest book &amp; gifts</div>
      </div>
      <div id="dayHeaderNormal">
        <div class="hub-day-title" id="dayTitle">Friday</div>
        <div class="hub-day-sub" id="daySub">11 September · 28° / 20°C, clear</div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab" data-day="fri" onclick="setDay('fri')">Fri 11</button>
      <button class="tab" data-day="sat" onclick="setDay('sat')">Sat 12</button>
      <button class="tab" data-day="sun" onclick="setDay('sun')">Sun 13</button>
      <button class="tab" data-day="extra" onclick="setDay('extra')" id="tabExtraBtn">Guest book &amp; gifts</button>
    </div>

    <div id="dayContent"></div>
  </div>
</div>

<script>
/* ---------------- Data ----------------
   Only generic, non-sensitive UI chrome lives here — it has to, since this
   file is served (and readable via "View Source") before anyone logs in.
   Everything about the actual wedding (schedule, venues, dress codes,
   coordinator contact, guest book / gift fund links, map embeds) is fetched
   from /.netlify/functions/content after a verified login; see
   fetchContent() below. It's merged into these per-language objects, so
   t(key) keeps working the same everywhere else in this file. */
const translations = {
  en: {
    pageTitle: "Merici & David's Wedding", weddingKicker: "The Wedding", amp: "&",
    passwordPlaceholder: "Password", passwordLabel: "Password", loginBtn: "Login", loggingIn: "Logging in...",
    errPasswordRequired: "Password required.", errAuthFailed: "Authentication failed.", errConnection: "Connection error. Please try again.", errTooManyAttempts: "Too many attempts. Please try again later.",
    langHint: "Language can be changed later from the menu.",
    logout: "Log out", questionsLabel: "Have any questions during the day?", callBtn: "Call", whatsappBtn: "WhatsApp",
    tabFri: "Fri 11", tabSat: "Sat 12", tabSun: "Sun 13", tabExtra: "Guest book & gifts",
    ceremonyHeading: "Ceremony", receptionHeading: "Reception", drinksHeading: "Afternoon Drinks", beachHeading: "Beach day",
    locationLabel: "Location", transportLabel: "Transport", dressLabel: "Dress code", scheduleLabel: "Schedule", notesLabel: "Notes",
    dayNameFri: "Friday", dayNameSat: "Saturday", dayNameSun: "Sunday",
    dayDateFri: "11 September", dayDateSat: "12 September", dayDateSun: "13 September",
    weatherLoading: "loading forecast…", weatherUnavailable: "forecast unavailable", rainLabel: "rain",
    guestbookHeading: "Guest book", giftfundHeading: "Gift fund", thankYou: "Thank you!",
    loadingContent: "Loading…"
  },
  es: {
    pageTitle: "Boda de Merici y David", weddingKicker: "La boda", amp: "y",
    passwordPlaceholder: "Contraseña", passwordLabel: "Contraseña", loginBtn: "Entrar", loggingIn: "Entrando...",
    errPasswordRequired: "Se requiere contraseña.", errAuthFailed: "Error de autenticación.", errConnection: "Error de conexión. Inténtalo de nuevo.", errTooManyAttempts: "Demasiados intentos. Inténtalo de nuevo más tarde.",
    langHint: "Puedes cambiar el idioma después desde el menú.",
    logout: "Cerrar sesión", questionsLabel: "¿Tienes alguna pregunta durante el día?", callBtn: "Llamar", whatsappBtn: "WhatsApp",
    tabFri: "Vie 11", tabSat: "Sáb 12", tabSun: "Dom 13", tabExtra: "Libro y regalo",
    ceremonyHeading: "Ceremonia", receptionHeading: "Recepción", drinksHeading: "Copas de la tarde", beachHeading: "Día de playa",
    locationLabel: "Ubicación", transportLabel: "Transporte", dressLabel: "Código de vestimenta", scheduleLabel: "Horario", notesLabel: "Notas",
    dayNameFri: "Viernes", dayNameSat: "Sábado", dayNameSun: "Domingo",
    dayDateFri: "11 de septiembre", dayDateSat: "12 de septiembre", dayDateSun: "13 de septiembre",
    weatherLoading: "cargando previsión…", weatherUnavailable: "previsión no disponible", rainLabel: "lluvia",
    guestbookHeading: "Libro de visitas", giftfundHeading: "Fondo de regalo", thankYou: "¡Gracias!",
    loadingContent: "Cargando…"
  },
  pt: {
    pageTitle: "Casamento de Merici e David", weddingKicker: "O casamento", amp: "e",
    passwordPlaceholder: "Palavra-passe", passwordLabel: "Palavra-passe", loginBtn: "Entrar", loggingIn: "A entrar...",
    errPasswordRequired: "Palavra-passe obrigatória.", errAuthFailed: "Falha na autenticação.", errConnection: "Erro de ligação. Tente novamente.", errTooManyAttempts: "Demasiadas tentativas. Tente novamente mais tarde.",
    langHint: "Pode alterar o idioma depois a partir do menu.",
    logout: "Sair", questionsLabel: "Tens alguma pergunta durante o dia?", callBtn: "Ligar", whatsappBtn: "WhatsApp",
    tabFri: "Sex 11", tabSat: "Sáb 12", tabSun: "Dom 13", tabExtra: "Livro e presente",
    ceremonyHeading: "Cerimónia", receptionHeading: "Receção", drinksHeading: "Copos da tarde", beachHeading: "Dia de praia",
    locationLabel: "Local", transportLabel: "Transporte", dressLabel: "Código de vestuário", scheduleLabel: "Horário", notesLabel: "Notas",
    dayNameFri: "Sexta-feira", dayNameSat: "Sábado", dayNameSun: "Domingo",
    dayDateFri: "11 de setembro", dayDateSat: "12 de setembro", dayDateSun: "13 de setembro",
    weatherLoading: "a carregar previsão…", weatherUnavailable: "previsão indisponível", rainLabel: "chuva",
    guestbookHeading: "Livro de visitas", giftfundHeading: "Fundo de presente", thankYou: "Obrigado!",
    loadingContent: "A carregar…"
  }
};

const wxCodeMap = {
  0:{en:'clear',es:'despejado',pt:'céu limpo'},1:{en:'mostly clear',es:'mayormente despejado',pt:'praticamente limpo'},
  2:{en:'partly cloudy',es:'parcialmente nublado',pt:'parcialmente nublado'},3:{en:'cloudy',es:'nublado',pt:'nublado'},
  45:{en:'fog',es:'niebla',pt:'névoa'},48:{en:'fog',es:'niebla',pt:'névoa'},
  51:{en:'light drizzle',es:'llovizna ligera',pt:'chuvisco leve'},53:{en:'drizzle',es:'llovizna',pt:'chuvisco'},55:{en:'heavy drizzle',es:'llovizna intensa',pt:'chuvisco forte'},
  61:{en:'light rain',es:'lluvia ligera',pt:'chuva leve'},63:{en:'rain',es:'lluvia',pt:'chuva'},65:{en:'heavy rain',es:'lluvia intensa',pt:'chuva forte'},
  80:{en:'rain showers',es:'chubascos',pt:'aguaceiros'},81:{en:'rain showers',es:'chubascos',pt:'aguaceiros'},82:{en:'heavy showers',es:'chubascos intensos',pt:'aguaceiros fortes'},
  95:{en:'thunderstorm',es:'tormenta',pt:'trovoada'},96:{en:'thunderstorm',es:'tormenta',pt:'trovoada'},99:{en:'thunderstorm',es:'tormenta',pt:'trovoada'}
};
function wxDescription(code){ const e = wxCodeMap[code] || wxCodeMap[3]; return e[currentLang] || e.en; }

/* ---------------- State ---------------- */
let currentUser = null;
let weatherData = null;
let contentLoaded = false;
let qrImages = { guestbook: null, giftfund: null }; // blob: object URLs once fetched
let currentDay = getStoredDay();
let menuOpen = false;

function todayIso() { return new Date().toISOString().slice(0,10); }

function todayDay() {
  const iso = todayIso();
  if (iso === "2026-09-12") return "sat";
  if (iso === "2026-09-13") return "sun";
  return "fri";
}

// Restores the tab the guest was last viewing across a page refresh, but only
// within the same calendar day — a browser tab left open past midnight (very
// plausible over a wedding weekend) should still land on the new day's tab
// by default instead of wherever it was left the night before.
function getStoredDay() {
  const saved = sessionStorage.getItem('currentDay');
  const savedDate = sessionStorage.getItem('currentDayDate');
  if (saved && savedDate === todayIso() && ['fri', 'sat', 'sun', 'extra'].includes(saved)) return saved;
  return todayDay();
}

function getCookie(name){ const m = document.cookie.match('(?:^|; )' + name + '=([^;]*)'); return m ? decodeURIComponent(m[1]) : null; }
function setCookie(name, value, days){ document.cookie = name + '=' + encodeURIComponent(value) + '; max-age=' + (days*24*60*60) + '; path=/; SameSite=Lax'; }

let currentLang = getCookie('lang') || 'en';
if (!translations[currentLang]) currentLang = 'en';
function t(key){ return (translations[currentLang] && translations[currentLang][key]) || translations.en[key] || ''; }

/* ---------------- Weather ---------------- */
function fetchWeather() {
  if (weatherData) { renderDay(); return; }
  const authToken = sessionStorage.getItem('auth_token');
  fetch('/.netlify/functions/weather', { headers: authToken ? { 'Authorization': 'Bearer ' + authToken } : {} })
    .then(res => res.json().then(body => ({ ok: res.ok, body })))
    .then(r => { weatherData = r.ok ? r.body : { error: true }; renderDay(); })
    .catch(() => { weatherData = { error: true }; renderDay(); });
}
function weatherLine(loc, date) {
  if (!weatherData || weatherData.error || !weatherData[loc] || !weatherData[loc][date]) return t('weatherUnavailable');
  const d = weatherData[loc][date];
  return d.max + '°/' + d.min + '°C, ' + wxDescription(d.code) + ' · ' + d.rain + '% ' + t('rainLabel');
}

/* ---------------- Private content (schedule, venues, coordinator, links) ---------------- */
function fetchContent() {
  if (contentLoaded) { renderDay(); return; }
  const authToken = sessionStorage.getItem('auth_token');
  fetch('/.netlify/functions/content', { headers: authToken ? { 'Authorization': 'Bearer ' + authToken } : {} })
    .then(res => res.ok ? res.json() : Promise.reject())
    .then(data => {
      ['en', 'es', 'pt'].forEach(lang => {
        if (data[lang]) Object.assign(translations[lang], data[lang]);
      });
      contentLoaded = true;
      applyHubTranslations();
      renderDay();
    })
    .catch(() => { renderDay(); });
}

// QR images are fetched with an Authorization header (an <img src> can't send
// one) and turned into blob: object URLs, rather than passing the token in
// the URL as a query param — query strings are more commonly logged by
// intermediate infrastructure than headers.
function fetchQrImage(key) {
  if (qrImages[key]) return Promise.resolve(qrImages[key]);
  const authToken = sessionStorage.getItem('auth_token');
  return fetch('/.netlify/functions/qrcode?key=' + key, { headers: authToken ? { 'Authorization': 'Bearer ' + authToken } : {} })
    .then(res => res.ok ? res.blob() : Promise.reject())
    .then(blob => {
      const url = URL.createObjectURL(blob);
      qrImages[key] = url;
      return url;
    });
}

/* ---------------- Language & menu ---------------- */
function changeLang(lang) {
  if (!translations[lang]) return;
  currentLang = lang;
  setCookie('lang', lang, 365);
  document.documentElement.lang = lang;
  document.title = t('pageTitle');
  menuOpen = false;
  document.getElementById('menuPanel').classList.remove('open');
  if (document.getElementById('hubPage').classList.contains('active')) {
    applyHubTranslations(); renderDay();
  } else {
    applyWelcomeTranslations();
  }
}
function toggleMenu() { menuOpen = !menuOpen; document.getElementById('menuPanel').classList.toggle('open', menuOpen); }
document.addEventListener('click', function(e) {
  const wrap = document.querySelector('.menu-wrap');
  if (wrap && !wrap.contains(e.target) && menuOpen) { menuOpen = false; document.getElementById('menuPanel').classList.remove('open'); }
});

function applyWelcomeTranslations() {
  document.getElementById('welcomeKicker').textContent = t('weddingKicker');
  document.getElementById('welcomeAmp').textContent = t('amp');
  document.getElementById('passwordLabel').textContent = t('passwordLabel');
  document.getElementById('passwordInp').placeholder = t('passwordPlaceholder');
  document.getElementById('langHint').textContent = t('langHint');
  const btn = document.getElementById('loginBtn');
  if (!btn.disabled) btn.textContent = t('loginBtn');
  document.getElementById('loginErr').style.display = 'none';
  document.querySelectorAll('.lang-pill').forEach(el => el.classList.toggle('active', el.dataset.lang === currentLang));
}
function applyHubTranslations() {
  document.getElementById('hubLogoutBtn').textContent = t('logout');
  document.getElementById('menuLangLabel').textContent = currentLang.toUpperCase();
  document.querySelector('[data-day="fri"]').textContent = t('tabFri');
  document.querySelector('[data-day="sat"]').textContent = t('tabSat');
  document.querySelector('[data-day="sun"]').textContent = t('tabSun');
  document.getElementById('tabExtraBtn').textContent = t('tabExtra');
  document.getElementById('dayTitleExtra').textContent = t('tabExtra');
  document.querySelectorAll('.menu-item[data-lang]').forEach(el => el.classList.toggle('active', el.dataset.lang === currentLang));
}

/* ---------------- Day tabs ---------------- */
function setDay(day) {
  currentDay = day;
  sessionStorage.setItem('currentDay', day);
  sessionStorage.setItem('currentDayDate', todayIso());
  renderDay();
}

function renderDay() {
  document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.dataset.day === currentDay));
  document.getElementById('dayHeaderExtra').style.display = currentDay === 'extra' ? '' : 'none';
  document.getElementById('dayHeaderNormal').style.display = currentDay === 'extra' ? 'none' : '';
  if (currentDay !== 'extra') {
    document.getElementById('dayTitle').textContent = t('dayName' + capitalize(currentDay));
    document.getElementById('daySub').textContent = t('dayDate' + capitalize(currentDay)) + ' · ' + (currentDay === 'sun' ? weatherLine('torremolinos','2026-09-13') : weatherLine('malaga', currentDay === 'fri' ? '2026-09-11' : '2026-09-12'));
  }

  const c = document.getElementById('dayContent');

  // The actual wedding content only exists client-side once fetchContent()
  // has merged it in post-login; show a brief loading state until then
  // rather than rendering blank cards from missing translation keys.
  if (!contentLoaded) {
    c.innerHTML = '<div class="day-panel"><div class="card qr-card"><div class="qr-body"><div class="qr-note">' + t('loadingContent') + '</div></div></div></div>';
    return;
  }

  if (currentDay === 'extra') {
    if (!qrImages.guestbook || !qrImages.giftfund) {
      c.innerHTML = '<div class="day-panel"><div class="card qr-card"><div class="qr-body"><div class="qr-note">' + t('loadingContent') + '</div></div></div></div>';
      Promise.all([fetchQrImage('guestbook'), fetchQrImage('giftfund')])
        .then(() => { if (currentDay === 'extra') renderDay(); })
        .catch(() => {});
      return;
    }
    const guestbookUrl = t('guestbookUrl');
    const giftfundUrl = t('giftfundUrl');
    c.innerHTML =
      '<div class="day-panel">' +
        '<div class="card qr-card"><div class="card-head center"><div class="dot"></div><div class="card-head-title">' + t('guestbookHeading') + '</div></div>' +
          '<div class="qr-body"><div class="qr-note">' + t('guestbookNote') + '</div>' +
          '<img class="qr-img" src="' + qrImages.guestbook + '" alt="Guest book QR code">' +
          '<a class="qr-link" href="' + guestbookUrl + '" target="_blank" rel="noopener">' + guestbookUrl.replace(/^https?:\/\//,'') + '</a></div></div>' +
        '<div class="card qr-card"><div class="card-head center"><div class="dot"></div><div class="card-head-title">' + t('giftfundHeading') + '</div></div>' +
          '<div class="qr-body"><div class="qr-note">' + t('giftfundNote') + '</div>' +
          '<img class="qr-img" src="' + qrImages.giftfund + '" alt="Gift fund QR code">' +
          '<a class="qr-link" href="' + giftfundUrl + '" target="_blank" rel="noopener">' + giftfundUrl.replace(/^https?:\/\//,'') + '</a></div></div>' +
      '</div>' + thankYouBlock();
    return;
  }

  function rail(rows) {
    return rows.map((r, i) => (
      '<div class="rail-row"><div class="rail-time">' + r[0] + '</div>' +
      '<div class="rail-line' + (i === rows.length - 1 ? ' last' : '') + '"><div class="rail-line-dot"></div></div>' +
      '<div class="rail-text' + (i === rows.length - 1 ? ' last' : '') + '">' + r[1] + '</div></div>'
    )).join('');
  }
  function fields(rows) {
    return '<div class="fields">' + rows.map(r => '<div><div class="field-label">' + r[0] + '</div><div class="field-value">' + r[1] + '</div></div>').join('') + '</div>';
  }
  function card(headingKey, railRows, fieldRows) {
    return '<div class="card"><div class="card-head"><div class="dot"></div><div class="card-head-title">' + t(headingKey) + '</div></div>' +
      '<div class="rail"><div class="rail-label">' + t('scheduleLabel') + '</div>' + rail(railRows) + '</div>' + fields(fieldRows) + '</div>';
  }
  function mapEmbed(mapKey, venueKey, locKey) {
    return '<div class="map-embed"><iframe src="' + t(mapKey) + '" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div><div class="map-caption">' + t(venueKey) + ', ' + t(locKey) + '</div>';
  }
  function notesList(key) {
    return '<div class="notes-list">' + t(key).map(item => '<div class="notes-item">' + item + '</div>').join('') + '</div>';
  }

  let html = '<div class="day-panel">';
  if (currentDay === 'fri') {
    html += card('ceremonyHeading', t('fri_c_schedule'), [
      [t('locationLabel'), mapEmbed('fri_c_map', 'fri_c_venue', 'fri_c_loc')],
      [t('transportLabel'), t('fri_c_transport')],
      [t('dressLabel'), t('fri_c_dress')]
    ]);
    html += card('receptionHeading', t('fri_r_schedule'), [
      [t('locationLabel'), mapEmbed('fri_r_map', 'fri_r_venue', 'fri_r_loc')],
      [t('transportLabel'), t('fri_r_transport')],
      [t('dressLabel'), t('fri_r_dress')]
    ]);
  } else if (currentDay === 'sat') {
    html += card('drinksHeading', t('sat_schedule'), [
      [t('locationLabel'), mapEmbed('sat_map', 'sat_venue', 'sat_loc')],
      [t('transportLabel'), t('sat_transport')],
      [t('dressLabel'), t('sat_dress')]
    ]);
  } else if (currentDay === 'sun') {
    html += card('beachHeading', t('sun_schedule'), [
      [t('locationLabel'), mapEmbed('sun_map', 'sun_venue', 'sun_loc')],
      [t('transportLabel'), t('sun_transport')],
      [t('dressLabel'), t('sun_dress')],
      [t('notesLabel'), notesList('sun_notes')]
    ]);
  }
  html += '</div>';
  html += footerCard();
  c.innerHTML = html;
}
function capitalize(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

function footerCard() {
  const phone = t('coordinatorPhone');
  return '<div class="footer-card"><div class="footer-inner"><div>' +
    '<div class="footer-label">' + t('questionsLabel') + '</div>' +
    '<div class="footer-name">' + t('coordinatorName') + '</div>' +
    '<div class="footer-role">' + t('coordinatorRole') + '</div></div>' +
    '<div class="footer-actions">' +
      '<a href="tel:' + phone + '" class="call-btn">' + t('callBtn') + '</a>' +
      '<a href="https://wa.me/' + phone.replace(/^\+/, '') + '" target="_blank" rel="noopener" class="call-btn">' + t('whatsappBtn') + '</a>' +
    '</div></div></div>';
}

function thankYouBlock() {
  return '<div class="thankyou-block"><div class="thankyou-text">' + t('thankYou') + '</div></div>';
}

/* ---------------- Routing / auth (unchanged from original site) ---------------- */
function navigate(path) { window.history.pushState({}, '', path); render(); }

function showWelcome() {
  document.getElementById('welcomePage').classList.add('active');
  document.getElementById('hubPage').classList.remove('active');
  document.getElementById('loginBtn').disabled = false;
  applyWelcomeTranslations();
  setTimeout(() => { const p = document.getElementById('passwordInp'); if (p) { p.value=''; p.focus(); } }, 0);
}

function render() {
  const path = window.location.pathname;
  document.getElementById('welcomePage').classList.remove('active');
  document.getElementById('hubPage').classList.remove('active');
  if (path === '/' || path === '') {
    if (sessionStorage.getItem('auth_token')) { navigate('/hub'); return; }
    showWelcome();
    return;
  }
  if (path === '/hub') {
    const token = sessionStorage.getItem('auth_token');
    if (!token) { navigate('/'); return; }
    fetch('/.netlify/functions/verify', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ token }) })
      .then(res => { if (!res.ok) throw new Error('invalid'); return res.json(); })
      .then(data => {
        if (!data.valid) throw new Error('invalid');
        document.getElementById('hubPage').classList.add('active');
        document.title = t('pageTitle');
        applyHubTranslations();
        currentDay = getStoredDay();
        renderDay();
        fetchWeather();
        fetchContent();
      })
      .catch(() => { sessionStorage.removeItem('auth_token'); navigate('/'); });
    return;
  }
  navigate('/');
}

function tryLogin() {
  const pass = document.getElementById('passwordInp').value.trim();
  const err = document.getElementById('loginErr');
  const btn = document.getElementById('loginBtn');
  if (!pass) { err.textContent = t('errPasswordRequired'); err.style.display='block'; return; }
  const originalText = t('loginBtn');
  btn.textContent = t('loggingIn'); btn.disabled = true;
  fetch('/.netlify/functions/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: pass }) })
    .then(res => res.json().then(data => ({ status: res.status, data })))
    .then(({ status, data }) => {
      if (data.token) {
        sessionStorage.setItem('auth_token', data.token);
        currentUser = 'guest'; err.style.display='none';
        navigate('/hub');
      } else {
        err.textContent = status === 429 ? t('errTooManyAttempts') : t('errAuthFailed');
        err.style.display='block';
        btn.textContent = originalText; btn.disabled = false;
      }
    })
    .catch(() => { err.textContent = t('errConnection'); err.style.display='block'; btn.textContent = originalText; btn.disabled = false; });
}

function logout() {
  currentUser = null;
  sessionStorage.removeItem('auth_token');
  Object.keys(qrImages).forEach(key => {
    if (qrImages[key]) URL.revokeObjectURL(qrImages[key]);
    qrImages[key] = null;
  });
  navigate('/');
}

document.addEventListener('DOMContentLoaded', function() {
  document.documentElement.lang = currentLang;
  document.title = t('pageTitle');
  document.querySelectorAll('.lang-pill').forEach(el => el.classList.toggle('active', el.dataset.lang === currentLang));
  window.addEventListener('popstate', render);
  render();
});
document.addEventListener('keypress', function(e) { if (e.target.id === 'passwordInp' && e.key === 'Enter') tryLogin(); });
</script>
