<html lang="en">

    * { margin:0; padding:0; box-sizing:border-box; }
    html { height: 100%; }
    body { height: 100%; margin: 0; padding: 0; font: 16px "DM Sans", sans-serif; background: white; color: var(--ink); line-height:1.6; }
    :root { --terra: #551C25; --orange: #551C25; --gold: #D4A843; --cobalt: #5B8DB8; --cream: #F6EEDF; --ink: #2C2A26; --ink-soft: #5C5650; --border: #E4DCC9; --bg: #FFFFFF; }
    
    .page { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; overflow: hidden; }
    .page.active { display: flex; }
    
    #welcomePage { background: linear-gradient(135deg, var(--cream) 0%, white 100%); }
    
    .welcome-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; text-align: center; width: 100%; }
    
    #hubPage { background: white; }
    .hub-page { flex: 1; display: flex; flex-direction: column; width: 100%; height: 100%; position: relative; }
    
    .hub-content { flex: 1; overflow-y: auto; display: flex; justify-content: center; width: 100%; padding: 3rem 1.5rem; }
    .hub-wrapper { max-width: 760px; width: 100%; }
    
    .hub-header { display: flex; gap: 2rem; margin-bottom: 3rem; align-items: flex-start; }
    .hub-welcome { flex: 1; }
    .hub-welcome h2 { font-size: 2.5rem; font-family: 'Cormorant Garamond', serif; color: var(--terra); margin-bottom: 0.5rem; }
    .hub-welcome p { color: var(--ink-soft); font-size: 1.05rem; }
    
    .hub-top-box { border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; background: white; width: 25%; flex-shrink: 0; }
    .hub-top-box p { margin: 0.5rem 0; font-size: 0.95rem; line-height: 1.5; }
    .hub-top-box p:first-child { color: var(--ink-soft); font-size: 0.875rem; }
    .hub-top-box p:last-child { font-weight: 600; }

    /* Language selector */
    .lang-bar { display: flex; justify-content: flex-end; margin-bottom: 1rem; }
    .lang-select { border: 1px solid var(--border); border-radius: 6px; padding: 0.4rem 0.6rem; font-size: 0.85rem; font-family: "DM Sans", sans-serif; color: var(--ink); background: white; cursor: pointer; }
    .lang-select:focus { outline: none; border-color: var(--terra); }
    .lang-bar-welcome { margin-bottom: 1.5rem; }
    
    .hub-footer { display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; border-top: 1px solid var(--border); background: white; }
    .hub-footer-content { max-width: 760px; width: 100%; text-align: center; }
    
    .s-card { border: 1px solid var(--border); border-radius: 12px; margin-bottom: 2rem; overflow: hidden; background: white; }
    .s-card-head { padding: 1.25rem; background: #F9F7F3; display: flex; align-items: center; gap: 0.75rem; justify-content: center; }
    .s-card-title { text-align: center; font-weight: 600; font-size: 1.1rem; letter-spacing: 0.01em; }
    .s-card-badge { font-size: 0.75rem; font-weight: 600; padding: 0.3rem 0.6rem; border-radius: 4px; background: #E8E0D0; color: var(--ink); flex-shrink: 0; }
    .badge-done { background: var(--terra); color: white; }
    .badge-pend { background: #F0E6D8; }
    .s-card-body { padding: 1.75rem 1.75rem; text-align: center; }
    .form-grp { margin: 1rem 0; }
    .form-lbl { display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--ink); font-size: 0.875rem; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .form-inp { width: 100%; padding: 0.875rem; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; font-family: "DM Sans", sans-serif; }
    .form-inp:focus { outline: none; border-color: var(--terra); box-shadow: 0 0 0 3px rgba(85,28,37,0.25); }
    .save-btn, .login-btn { background: var(--terra); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 1rem; }
    .save-btn:hover, .login-btn:hover { opacity: 0.9; }
    .save-btn:disabled, .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .save-ok { display: none; color: var(--terra); font-size: 0.875rem; margin-top: 0.5rem; }
    .save-ok.show { display: block; }
    .login-err { color: #c23b3b; margin-top: 1rem; font-size: 0.875rem; }
    .hub-note { font-size: 0.875rem; color: var(--ink-soft); line-height: 1.7; }
    .prac-item { display: flex; flex-direction: column; padding: 1.1rem 0; border-bottom: 1px solid var(--border); gap: 0.5rem; text-align: left; }
    .prac-item:last-child { border-bottom: none; }
    .prac-item label { font-weight: 600; }
    .prac-item span { color: var(--ink-soft); font-size: 0.95rem; line-height: 1.6; }
    .day-block { margin-bottom: 1.5rem; }
    .day-block:last-child { margin-bottom: 0; }
    .day-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 1rem; color: var(--terra); }
    .day-dress-code { font-size: 0.875rem; color: var(--ink-soft); margin-top: 0.5rem; margin-bottom: 1.5rem; text-align: left; }
    .day-dress-code strong { color: var(--ink); }
    
    /* Invisible table styles */
    .schedule-table { width: 100%; border-collapse: collapse; margin: 0 auto 1rem; }
    .schedule-table td { padding: 0.65rem 0; border: none; text-align: left; font-size: 1rem; line-height: 1.55; }
    .schedule-table td:first-child { width: 88px; font-weight: 600; white-space: nowrap; color: var(--terra); vertical-align: top; padding-top: 0.75rem; }
    .schedule-table td:last-child { padding-left: 1rem; color: var(--ink-soft); padding-top: 0.65rem; }

    /* Centered variant: used for Ceremony & Reception schedules so both
       columns sit centered as a block within the card, matching the
       centered section heading above each. */
    .schedule-table.centered { width: auto; margin: 0 auto 1rem; }
    .schedule-table.centered td { text-align: center; }
    .schedule-table.centered td:first-child { width: auto; padding-right: 1.1rem; text-align: right; }
    .schedule-table.centered td:last-child { padding-left: 0; text-align: left; }
    
    .section-heading { font-size: 1.05rem; font-weight: 700; color: var(--terra); letter-spacing: 0.01em; margin-top: 1.85rem; margin-bottom: 0.9rem; text-align: left; }
    .section-heading:first-of-type { margin-top: 0; text-align: center; }
    
    .event-note { font-size: 0.9rem; color: var(--ink-soft); line-height: 1.6; margin-top: 1rem; font-style: italic; text-align: left; }
    .map-link { color: var(--terra); text-decoration: underline; text-decoration-color: rgba(85,28,37,0.35); text-decoration-thickness: 1px; }
    .map-link:hover { text-decoration-color: var(--terra); }

    .event-field { font-size: 0.95rem; color: var(--ink-soft); line-height: 1.6; margin: 0.6rem 0; padding-left: 0.85rem; border-left: 3px solid var(--border); text-align: left; }
    .event-field:last-of-type { margin-bottom: 1rem; }
    .event-field strong { display: inline-block; min-width: 6.5rem; color: var(--terra); font-weight: 600; }

    /* Responsive design */
    @media (min-width: 768px) {
      .prac-item { flex-direction: row; justify-content: space-between; gap: 1rem; text-align: left; }
      .prac-item span { text-align: right; }
    }

    @media (max-width: 640px) {
      .welcome-screen { padding: 1.5rem; }
      h1 { font-size: 2rem !important; }
      h2 { font-size: 2rem !important; }
      .hub-content { padding: 2rem 1.25rem; }
      .hub-footer { padding: 1.5rem 1rem; }
      .s-card-head { padding: 1.1rem; }
      .s-card-body { padding: 1.25rem; }
      .day-title { font-size: 1rem; }
      .schedule-table td { font-size: 0.95rem; }
      .schedule-table td:first-child { width: 68px; font-size: 0.9rem; }
      .schedule-table.centered { width: 100%; }
      .schedule-table.centered td:first-child { width: 68px; }
      .event-field { font-size: 0.9rem; }
      .event-field strong { min-width: 5.5rem; }
      .hub-header { flex-direction: column; gap: 1rem; margin-bottom: 2rem; align-items: stretch; }
      .hub-welcome h2 { font-size: 1.8rem; }
      .hub-top-box { width: 100%; flex-shrink: auto; padding: 1rem; }
    }
  </style>
</head>

<!-- Welcome Page with Password -->
<div id="welcomePage" class="page">

    <div class="lang-bar lang-bar-welcome">

        <option value="es">Español</option>
        <option value="pt">Português</option>
      </select>
    </div>
    <h1 id="welcomeHeading" style="font-size: 2.8rem; font-family: 'Cormorant Garamond', serif; color: var(--terra); margin-bottom: 2rem;">Merici &amp; David's Wedding</h1>
    <div style="margin-bottom: 1rem; width: 100%; max-width: 300px; margin-left: auto; margin-right: auto;">
      <label for="passwordInp" class="visually-hidden" id="passwordLabel">Password</label>
      <input type="password" id="passwordInp" placeholder="Password" autocomplete="current-password" style="width: 100%; padding: 0.875rem; border: 2px solid var(--terra); border-radius: 8px; font-size: 1rem;">
    </div>
    <button class="login-btn" id="loginBtn" onclick="tryLogin()" style="">Login</button>
    <div id="loginErr" class="login-err" role="alert" aria-live="polite"></div>
  </div>
</div>

<!-- Hub Page (Itinerary) -->

            <option value="es">Español</option>
            <option value="pt">Português</option>
          </select>
        </div>
        <!-- Welcome heading and Questions box on same row -->
        <div class="hub-header">

            <h2 id="hubWelcomeHeading">Welcome</h2>
            <p id="hubSubtitleText">Here's everything you need for the weekend.</p>
          </div>
          <div class="hub-top-box">
            <p id="hubQuestionsLabel">Questions?</p>
            <p id="hubCoordinatorLine">Lucia &middot; Event Coordinator &middot; +34 666 89 11 00</p>
          </div>
        </div>
        
        <div id="hubContent"></div>
        
        <!-- Footer with logout (inside scrollable content) -->
        <div class="hub-footer">
          <div class="hub-footer-content">
            <button id="hubLogoutBtn" onclick="logout()" style="background: transparent; color: var(--terra); border: 1px solid var(--terra); padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer;">Log out</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

function getCookie(name) {
  const match = document.cookie.match('(?:^|; )' + name + '=([^;]*)');
  return match ? decodeURIComponent(match[1]) : null;
}
function setCookie(name, value, days) {
  const maxAge = days * 24 * 60 * 60;
  document.cookie = name + '=' + encodeURIComponent(value) + '; max-age=' + maxAge + '; path=/; SameSite=Lax';
}

let currentLang = getCookie('lang') || 'en';
if (!translations[currentLang]) currentLang = 'en';

function t(key) {
  return (translations[currentLang] && translations[currentLang][key]) || translations.en[key] || '';
}

function syncLangSelectors() {
  const w = document.getElementById('langSelectWelcome');
  const h = document.getElementById('langSelectHub');
  if (w) w.value = currentLang;
  if (h) h.value = currentLang;
}

function changeLang(lang) {
  if (!translations[lang]) return;
  currentLang = lang;
  setCookie('lang', lang, 365);
  document.documentElement.lang = lang;
  document.title = t('pageTitle');
  syncLangSelectors();
  if (document.getElementById('hubPage').classList.contains('active')) {
    applyHubTranslations();
    renderHub();
  } else {
    applyWelcomeTranslations();
  }
}

function applyWelcomeTranslations() {
  document.getElementById('welcomeHeading').textContent = t('welcomeHeading');
  document.getElementById('passwordLabel').textContent = t('passwordLabel');
  const pass = document.getElementById('passwordInp');
  if (pass) pass.placeholder = t('passwordPlaceholder');
  const btn = document.getElementById('loginBtn');
  if (btn && !btn.disabled) btn.textContent = t('loginBtn');
  document.getElementById('loginErr').textContent = '';
}

function applyHubTranslations() {
  document.getElementById('hubWelcomeHeading').textContent = t('hubWelcome');
  document.getElementById('hubSubtitleText').textContent = t('hubSubtitle');
  document.getElementById('hubQuestionsLabel').textContent = t('questionsLabel');
  document.getElementById('hubCoordinatorLine').innerHTML = t('coordinatorLine');
  document.getElementById('hubLogoutBtn').textContent = t('logout');
}

/* ---------------- Routing ---------------- */

function navigate(path) {
  window.history.pushState({}, '', path);
  render();
}

function showWelcome() {
  document.getElementById('welcomePage').classList.add('active');
  document.getElementById('hubPage').classList.remove('active');
  applyWelcomeTranslations();
  syncLangSelectors();
  setTimeout(() => {
    const pass = document.getElementById('passwordInp');
    if (pass) {
      pass.value = '';
      pass.focus();
    }
  }, 0);
}

function render() {
  const path = window.location.pathname;
  
  // Hide all pages
  document.getElementById('welcomePage').classList.remove('active');
  document.getElementById('hubPage').classList.remove('active');
  
  // Show appropriate page
  if (path === '/' || path === '') {
    showWelcome();
  } else if (path === '/hub') {
    const token = sessionStorage.getItem('auth_token');
    if (!token) {
      navigate('/');
      return;
    }
    // Never trust the mere presence of a token — verify its signature and
    // expiry with the server before rendering any hub content. This closes
    // the bypass where a fake sessionStorage value used to grant access.
    fetch('/.netlify/functions/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token })
    })
    .then(res => {
      if (!res.ok) throw new Error('invalid');
      return res.json();
    })
    .then(data => {
      if (!data.valid) throw new Error('invalid');
      document.getElementById('hubPage').classList.add('active');
      document.title = t('pageTitle');
      applyHubTranslations();
      syncLangSelectors();
      renderHub();
    })
    .catch(() => {
      sessionStorage.removeItem('auth_token');
      navigate('/');
    });
  } else {
    navigate('/');
  }
}

function tryLogin() {
  const pass = document.getElementById('passwordInp').value.trim();
  const err = document.getElementById('loginErr');
  const btn = document.getElementById('loginBtn');
  
  if (!pass) {
    err.textContent = t('errPasswordRequired');
    return;
  }

  // Show loading state
  const originalText = t('loginBtn');
  btn.textContent = t('loggingIn');
  btn.disabled = true;

  // Send password to server for validation
  fetch('/.netlify/functions/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pass })
  })
  .then(res => res.json())
  .then(data => {
    if (data.token) {
      // Store the signed, time-bound token in sessionStorage (cleared when
      // the browser closes). /hub re-verifies it server-side on every visit.
      sessionStorage.setItem('auth_token', data.token);
      currentUser = 'guest';
      err.textContent = '';
      navigate('/hub');
    } else {
      err.textContent = data.error ? t('errAuthFailed') : t('errAuthFailed');
      btn.textContent = originalText;
      btn.disabled = false;
    }
  })
  .catch(err2 => {
    console.error('Login error:', err2);
    err.textContent = t('errConnection');
    btn.textContent = originalText;
    btn.disabled = false;
  });
}

function logout() {
  currentUser = null;
  sharedData = {};
  sessionStorage.removeItem('auth_token');
  navigate('/');
}

document.addEventListener('DOMContentLoaded', function() {
  document.documentElement.lang = currentLang;
  document.title = t('pageTitle');
  syncLangSelectors();
  // Handle back/forward buttons
  window.addEventListener('popstate', render);
  
  // Initial render
  render();
});

// Allow Enter key on password field
document.addEventListener('keypress', function(e) {
  if (e.target.id === 'passwordInp' && e.key === 'Enter') {
    tryLogin();
  }
});
