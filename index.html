<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Merici & David's Wedding</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html { height: 100%; }
    body { height: 100%; margin: 0; padding: 0; font: 16px "DM Sans", sans-serif; background: white; color: var(--ink); line-height:1.6; }
    :root { --terra: #551C25; --orange: #551C25; --gold: #D4A843; --cobalt: #5B8DB8; --cream: #F6EEDF; --ink: #2C2A26; --ink-soft: #6B6459; --border: #E4DCC9; --bg: #FFFFFF; }
    
    .page { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; overflow: hidden; }
    .page.active { display: flex; }
    
    #welcomePage { background: linear-gradient(135deg, var(--cream) 0%, white 100%); }
    
    .welcome-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; text-align: center; width: 100%; }
    
    #hubPage { background: white; }
    .hub-page { flex: 1; display: flex; flex-direction: column; width: 100%; height: 100%; position: relative; }
    
    .hub-content { flex: 1; overflow-y: auto; display: flex; justify-content: center; width: 100%; padding: 2rem 1rem; }
    .hub-wrapper { max-width: 900px; width: 100%; }
    
    .hub-header { display: flex; gap: 2rem; margin-bottom: 3rem; align-items: flex-start; }
    .hub-welcome { flex: 1; }
    .hub-welcome h2 { font-size: 2.5rem; font-family: 'Cormorant Garamond', serif; color: var(--terra); margin-bottom: 0.5rem; }
    .hub-welcome p { color: var(--ink-soft); }
    
    .hub-top-box { border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; background: white; width: 25%; flex-shrink: 0; }
    .hub-top-box p { margin: 0.5rem 0; font-size: 0.9rem; }
    .hub-top-box p:first-child { color: var(--ink-soft); font-size: 0.875rem; }
    .hub-top-box p:last-child { font-weight: 500; }
    
    .hub-footer { display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; border-top: 1px solid var(--border); background: white; }
    .hub-footer-content { max-width: 900px; width: 100%; text-align: center; }
    
    .s-card { border: 1px solid var(--border); border-radius: 12px; margin-bottom: 1.5rem; overflow: hidden; background: white; }
    .s-card-head { padding: 1.1rem; background: #F9F7F3; display: flex; align-items: center; gap: 0.75rem; justify-content: center; }
    .s-card-title { text-align: center; font-weight: 500; }
    .s-card-badge { font-size: 0.75rem; font-weight: 600; padding: 0.3rem 0.6rem; border-radius: 4px; background: #E8E0D0; color: var(--ink); flex-shrink: 0; }
    .badge-done { background: var(--terra); color: white; }
    .badge-pend { background: #F0E6D8; }
    .s-card-body { padding: 1rem 1.1rem; text-align: center; }
    .form-grp { margin: 1rem 0; }
    .form-lbl { display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--ink); font-size: 0.875rem; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .form-inp { width: 100%; padding: 0.875rem; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; font-family: "DM Sans", sans-serif; }
    .form-inp:focus { outline: none; border-color: var(--terra); box-shadow: 0 0 0 3px rgba(85,28,37,0.25); }
    .save-btn, .login-btn { background: var(--terra); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 1rem; }
    .save-btn:hover, .login-btn:hover { opacity: 0.9; }
    .save-btn:disabled, .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .save-ok { display: none; color: var(--terra); font-size: 0.875rem; margin-top: 0.5rem; }
    .save-ok.show { display: block; }
    .login-err { color: #c23b3b; margin-top: 1rem; font-size: 0.875rem; }
    .hub-note { font-size: 0.875rem; color: var(--ink-soft); line-height: 1.7; }
    .prac-item { display: flex; flex-direction: column; padding: 1rem 0; border-bottom: 1px solid var(--border); gap: 0.5rem; text-align: left; }
    .prac-item:last-child { border-bottom: none; }
    .prac-item label { font-weight: 500; }
    .prac-item span { color: var(--ink-soft); font-size: 0.9rem; }
    .day-block { margin-bottom: 1.5rem; }
    .day-block:last-child { margin-bottom: 0; }
    .day-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 1rem; color: var(--terra); }
    .day-dress-code { font-size: 0.875rem; color: var(--ink-soft); margin-top: 0.5rem; margin-bottom: 1.5rem; text-align: left; }
    .day-dress-code strong { color: var(--ink); }
    
    /* Invisible table styles */
    .schedule-table { width: 100%; border-collapse: collapse; margin: 0 auto 0.75rem; }
    .schedule-table td { padding: 0.5rem 0; border: none; text-align: left; }
    .schedule-table td:first-child { width: 80px; font-weight: 500; white-space: nowrap; }
    .schedule-table td:last-child { padding-left: 1rem; color: var(--ink-soft); }

    /* Centered variant: used for Ceremony & Reception schedules so both
       columns sit centered as a block within the card, matching the
       centered section heading above each. */
    .schedule-table.centered { width: auto; margin: 0 auto 0.75rem; }
    .schedule-table.centered td { text-align: center; }
    .schedule-table.centered td:first-child { width: auto; padding-right: 1rem; }
    .schedule-table.centered td:last-child { padding-left: 0; text-align: left; }
    
    .section-heading { font-size: 0.95rem; font-weight: 600; color: var(--terra); margin-top: 1.5rem; margin-bottom: 0.75rem; text-align: left; }
    .section-heading:first-of-type { margin-top: 0; text-align: center; }
    
    .event-note { font-size: 0.85rem; color: var(--ink-soft); margin-top: 1rem; font-style: italic; text-align: left; }
    .map-link { color: var(--terra); }

    .event-field { font-size: 0.85rem; color: var(--ink-soft); margin: 0.25rem 0 0.5rem; text-align: left; }
    .event-field:last-of-type { margin-bottom: 0.75rem; }
    .event-field strong { color: var(--ink); }

    /* Responsive design */
    @media (min-width: 768px) {
      .prac-item { flex-direction: row; justify-content: space-between; gap: 1rem; text-align: left; }
      .prac-item span { text-align: right; }
    }

    @media (max-width: 640px) {
      .welcome-screen { padding: 1.5rem; }
      h1 { font-size: 2rem !important; }
      h2 { font-size: 2rem !important; }
      .hub-content { padding: 1.5rem 1rem; }
      .hub-footer { padding: 1.5rem 1rem; }
      .s-card-head { padding: 1rem; }
      .s-card-body { padding: 1rem; }
      .day-title { font-size: 1rem; }
      .schedule-table td:first-child { width: 70px; font-size: 0.9rem; }
      .schedule-table.centered { width: 100%; }
      .schedule-table.centered td:first-child { width: 70px; }
      .hub-header { flex-direction: column; gap: 1rem; margin-bottom: 2rem; align-items: stretch; }
      .hub-welcome h2 { font-size: 1.8rem; }
      .hub-top-box { width: 100%; flex-shrink: auto; padding: 1rem; }
    }
  </style>
</head>
<body>

<!-- Welcome Page with Password -->
<div id="welcomePage" class="page">
  <div class="welcome-screen">
    <h1 style="font-size: 2.8rem; font-family: 'Cormorant Garamond', serif; color: var(--terra); margin-bottom: 2rem;">Merici &amp; David's Wedding</h1>
    <div style="margin-bottom: 1rem; width: 100%; max-width: 300px; margin-left: auto; margin-right: auto;">
      <label for="passwordInp" class="visually-hidden">Password</label>
      <input type="password" id="passwordInp" placeholder="Password" autocomplete="current-password" style="width: 100%; padding: 0.875rem; border: 2px solid var(--terra); border-radius: 8px; font-size: 1rem;">
    </div>
    <button class="login-btn" id="loginBtn" onclick="tryLogin()" style="">Login</button>
    <div id="loginErr" class="login-err" role="alert" aria-live="polite"></div>
  </div>
</div>

<!-- Hub Page (Itinerary) -->
<div id="hubPage" class="page">
  <div class="hub-page">
    <!-- Main content -->
    <div class="hub-content">
      <div class="hub-wrapper">
        <!-- Welcome heading and Questions box on same row -->
        <div class="hub-header">
          <div class="hub-welcome">
            <h2>Welcome</h2>
            <p>Here's everything you need for the weekend.</p>
          </div>
          <div class="hub-top-box">
            <p>Questions?</p>
            <p>Lucia &middot; Event Coordinator &middot; +34 666 89 11 00</p>
          </div>
        </div>
        
        <div id="hubContent"></div>
        
        <!-- Footer with logout (inside scrollable content) -->
        <div class="hub-footer">
          <div class="hub-footer-content">
            <button onclick="logout()" style="background: transparent; color: var(--terra); border: 1px solid var(--terra); padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer;">Log out</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let currentUser = null;
let sharedData = {};

function navigate(path) {
  window.history.pushState({}, '', path);
  render();
}

function showWelcome() {
  document.getElementById('welcomePage').classList.add('active');
  document.getElementById('hubPage').classList.remove('active');
  setTimeout(() => {
    const pass = document.getElementById('passwordInp');
    if (pass) {
      pass.value = '';
      pass.focus();
    }
  }, 0);
}

function render() {
  const path = window.location.pathname;
  
  // Hide all pages
  document.getElementById('welcomePage').classList.remove('active');
  document.getElementById('hubPage').classList.remove('active');
  
  // Show appropriate page
  if (path === '/' || path === '') {
    showWelcome();
  } else if (path === '/hub') {
    const token = sessionStorage.getItem('auth_token');
    if (!token) {
      navigate('/');
      return;
    }
    // Never trust the mere presence of a token — verify its signature and
    // expiry with the server before rendering any hub content. This closes
    // the bypass where a fake sessionStorage value used to grant access.
    fetch('/.netlify/functions/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token })
    })
    .then(res => {
      if (!res.ok) throw new Error('invalid');
      return res.json();
    })
    .then(data => {
      if (!data.valid) throw new Error('invalid');
      document.getElementById('hubPage').classList.add('active');
      renderHub();
    })
    .catch(() => {
      sessionStorage.removeItem('auth_token');
      navigate('/');
    });
  } else {
    navigate('/');
  }
}

function tryLogin() {
  const pass = document.getElementById('passwordInp').value.trim();
  const err = document.getElementById('loginErr');
  const btn = document.getElementById('loginBtn');
  
  if (!pass) {
    err.textContent = 'Password required.';
    return;
  }

  // Show loading state
  const originalText = btn.textContent;
  btn.textContent = 'Logging in...';
  btn.disabled = true;

  // Send password to server for validation
  fetch('/.netlify/functions/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pass })
  })
  .then(res => res.json())
  .then(data => {
    if (data.token) {
      // Store the signed, time-bound token in sessionStorage (cleared when
      // the browser closes). /hub re-verifies it server-side on every visit.
      sessionStorage.setItem('auth_token', data.token);
      currentUser = 'guest';
      err.textContent = '';
      navigate('/hub');
    } else {
      err.textContent = data.error || 'Authentication failed.';
      btn.textContent = originalText;
      btn.disabled = false;
    }
  })
  .catch(err => {
    console.error('Login error:', err);
    err.textContent = 'Connection error. Please try again.';
    btn.textContent = originalText;
    btn.disabled = false;
  });
}

function logout() {
  currentUser = null;
  sharedData = {};
  sessionStorage.removeItem('auth_token');
  navigate('/');
}

document.addEventListener('DOMContentLoaded', function() {
  // Handle back/forward buttons
  window.addEventListener('popstate', render);
  
  // Initial render
  render();
});

// Allow Enter key on password field
document.addEventListener('keypress', function(e) {
  if (e.target.id === 'passwordInp' && e.key === 'Enter') {
    tryLogin();
  }
});

function renderHub() {
  const c = document.getElementById('hubContent');
  let html = '';

  html += '<div class="s-card">' +
    '<div class="s-card-head">' +
    '<div class="s-card-title">Friday 11 September</div>' +
    '</div>' +
    '<div class="s-card-body">' +

    '<div class="section-heading">Ceremony</div>' +
    '<table class="schedule-table centered">' +
    '<tr><td>17:30</td><td>Ceremony at <a href="https://www.google.com/maps/search/?api=1&query=Iglesia+de+San+Juan+Malaga" target="_blank" rel="noopener" class="map-link">Iglesia de San Juan, M&aacute;laga</a> (approx. 45min&ndash;1hr)</td></tr>' +
    '<tr><td>~18:15</td><td>Photos outside the church (approx. 20 minutes)</td></tr>' +
    '</table>' +
    '<div class="event-field"><strong>Location:</strong> <a href="https://www.google.com/maps/search/?api=1&query=Iglesia+de+San+Juan+Malaga" target="_blank" rel="noopener" class="map-link">Iglesia de San Juan</a>, M&aacute;laga historic centre.</div>' +
    '<div class="event-field"><strong>Transport:</strong> Only reachable on foot &mdash; cars aren\'t permitted in the historic centre, so allow a few extra minutes to arrive on time.</div>' +
    '<div class="event-field"><strong>Dress code:</strong> Casual elegant or cocktail, think long summer dresses, a button-down shirt, or dress trousers with a tie and blazer. Please cover your shoulders for the ceremony.</div>' +

    '<div class="section-heading" style="text-align:center">Reception</div>' +
    '<table class="schedule-table centered">' +
    '<tr><td>19:00</td><td>Guest arrival at <a href="https://www.google.com/maps/search/?api=1&query=Hacienda+Nadales+Camino+de+Casabermeja+128+Malaga" target="_blank" rel="noopener" class="map-link">Hacienda Nadales</a>, taxi, Uber, or car are the easiest options</td></tr>' +
    '<tr><td>19:15</td><td>Cocktails begin, lower area of the palacete</td></tr>' +
    '<tr><td>20:30</td><td>Dinner &amp; celebration, in front of the palacete</td></tr>' +
    '<tr><td>22:45</td><td>Open bar &amp; dancing</td></tr>' +
    '<tr><td>01:15</td><td>Late-night bites</td></tr>' +
    '<tr><td>03:00</td><td>Open bar ends</td></tr>' +
    '</table>' +
    '<div class="event-field"><strong>Location:</strong> <a href="https://www.google.com/maps/search/?api=1&query=Hacienda+Nadales+Camino+de+Casabermeja+128+Malaga" target="_blank" rel="noopener" class="map-link">Hacienda Nadales</a>, Camino de Casabermeja 128, M&aacute;laga.</div>' +
    '<div class="event-field"><strong>Transport:</strong> Taxi, Uber, or car are the easiest options; we are not providing transport.</div>' +
    '<div class="event-field"><strong>Dress code:</strong> Casual elegant or cocktail, think long summer dresses, a button-down shirt, or dress trousers with a tie and blazer.</div>' +

    '</div>' +
    '</div>';

  html += '<div class="s-card">' +
    '<div class="s-card-head">' +
    '<div class="s-card-title">Saturday 12 September</div>' +
    '</div>' +
    '<div class="s-card-body">' +

    '<div class="section-heading">Drinks &amp; tapas</div>' +
    '<table class="schedule-table">' +
    '<tr><td>15:00&ndash;17:00</td><td>Drinks &amp; tapas at <a href="https://www.google.com/maps/search/?api=1&query=Trocadero+Casa+de+Botes+Paseo+de+la+Farola+25+Malaga" target="_blank" rel="noopener" class="map-link">Trocadero Casa de Botes, M&aacute;laga</a></td></tr>' +
    '<tr><td>From 17:00</td><td>Up to the terrace, chill-out area with skyline views, or the music &amp; DJ area if you feel like partying</td></tr>' +
    '<tr><td></td><td><em style="color:var(--ink-soft)">No fixed plan after that, we\'ll see how we feel.</em></td></tr>' +
    '</table>' +
    '<div class="event-field"><strong>Location:</strong> <a href="https://www.google.com/maps/search/?api=1&query=Trocadero+Casa+de+Botes+Paseo+de+la+Farola+25+Malaga" target="_blank" rel="noopener" class="map-link">Trocadero Casa de Botes</a>, Paseo de la Farola 25, M&aacute;laga.</div>' +
    '<div class="event-field"><strong>Transport:</strong> Taxi, Uber, or car recommended; we are not providing transport.</div>' +
    '<div class="event-field"><strong>Dress code:</strong> Smart resort casual, Trocadero is a stylish waterfront terrace, so think elevated but relaxed: linen shirts, sundresses, smart sandals or espadrilles. No swimwear or flip-flops.</div>' +

    '</div>' +
    '</div>';

  html += '<div class="s-card">' +
    '<div class="s-card-head">' +
    '<div class="s-card-title">Sunday 13 September</div>' +
    '</div>' +
    '<div class="s-card-body">' +

    '<div class="section-heading">Beach day</div>' +
    '<table class="schedule-table">' +
    '<tr><td>From 13:00</td><td><a href="https://www.google.com/maps/search/?api=1&query=La+Playa+Surf+House+Torremolinos" target="_blank" rel="noopener" class="map-link">La Playa Surf House, Torremolinos</a></td></tr>' +
    '<tr><td></td><td><span style="color:var(--ink-soft)">We\'ll be spending the day unwinding from the wedding, you\'re welcome to join us. If you\'d like help arranging a beach bed, just let us know and we\'ll ask our planner.</span></td></tr>' +
    '</table>' +
    '<div class="event-field"><strong>Location:</strong> <a href="https://www.google.com/maps/search/?api=1&query=La+Playa+Surf+House+Torremolinos" target="_blank" rel="noopener" class="map-link">La Playa Surf House</a>, Torremolinos.</div>' +
    '<div class="event-field"><strong>Transport:</strong> Taxi, Uber, or car recommended; we are not providing transport.</div>' +
    '<div class="event-field"><strong>Dress code:</strong> Casual beachwear, obviously.</div>' +

    '</div>' +
    '</div>';

  html += '<div class="s-card">' +
    '<div class="s-card-head">' +
    '<div class="s-card-title">Useful Information</div>' +
    '</div>' +
    '<div class="s-card-body">' +
    '<div class="prac-item"><label>Taxi (M&aacute;laga capital)</label><span>+34 952 33 33 33</span></div>' +
    '<div class="prac-item"><label>Weather</label><span>Warm, 27&ndash;32&deg;C<br>Bring sun protection</span></div>' +
    '</div>' +
    '</div>';

  c.innerHTML = html;
}
</script>
</body>
</html>
