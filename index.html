  .welcome-kicker { font:400 13px "DM Sans",sans-serif; letter-spacing:.28em; text-transform:uppercase; color:var(--gold); margin-bottom:18px; }
  .welcome-hero h1 { font:300 54px "Cormorant Garamond",serif; color:var(--cream); line-height:1.0; }
  .welcome-hero h1 em { font-style:italic; font-size:40px; color:var(--gold); }

  .login-card input { width:100%; padding:15px 14px; border:1px solid var(--border); border-radius:10px; background:#fff; font:400 16px "DM Sans",sans-serif; color:var(--ink); margin-bottom:10px; }
  .login-card button { width:100%; padding:15px; border:none; border-radius:10px; background:var(--terra); color:var(--cream); font:600 15px "DM Sans",sans-serif; cursor:pointer; }
  .login-card button:hover { background:#43161d; }
  .login-card button:disabled { opacity:.6; cursor:not-allowed; }
  .login-err { color:#c23b3b; font:400 13px "DM Sans",sans-serif; margin-bottom:10px; }
  .login-hint { font:400 12.5px "DM Sans",sans-serif; color:#8A8378; margin-top:12px; text-align:center; }

  .menu-btn { display:flex; align-items:center; gap:6px; border:1px solid rgba(246,238,223,.4); background:transparent; border-radius:999px; padding:6px 12px; cursor:pointer; font:600 11px "DM Sans",sans-serif; letter-spacing:.1em; color:var(--cream); }
  .menu-panel { position:absolute; top:calc(100% + 8px); right:0; z-index:20; width:170px; padding:6px; background:#FCF8F0; border:1px solid var(--border); border-radius:8px; box-shadow:0 12px 32px rgba(45,43,43,.22); display:none; }
  .menu-panel.open { display:block; }
  .menu-item { display:block; width:100%; text-align:left; border:none; background:transparent; padding:8px 10px; border-radius:4px; cursor:pointer; color:#3E3A34; font:400 13.5px "DM Sans",sans-serif; }

  .hub-day-sub { font:400 12.5px "DM Sans",sans-serif; letter-spacing:.12em; text-transform:uppercase; color:rgba(246,238,223,.65); margin-top:2px; }

  .tabs { position:sticky; top:0; z-index:5; background:var(--terra); padding:0 20px 12px; display:flex; gap:7px; box-shadow:0 6px 12px -8px rgba(45,43,43,.5); }
  .tab { flex:1; padding:9px 4px; border-radius:999px; border:1px solid rgba(246,238,223,.3); background:transparent; color:rgba(246,238,223,.75); font:600 13px "DM Sans",sans-serif; cursor:pointer; }

  .card-head-title { font:700 12px "DM Sans",sans-serif; letter-spacing:.14em; text-transform:uppercase; color:var(--terra); }

  .rail-row { display:grid; grid-template-columns:50px 18px 1fr; }

    </div>

    <div id="dayContent"></div>
  </div>
</div>

  45:{en:'fog',es:'niebla',pt:'névoa'},48:{en:'fog',es:'niebla',pt:'névoa'},
  51:{en:'light drizzle',es:'llovizna ligera',pt:'chuvisco leve'},53:{en:'drizzle',es:'llovizna',pt:'chuvisco'},55:{en:'heavy drizzle',es:'llovizna intensa',pt:'chuvisco forte'},
  61:{en:'light rain',es:'lluvia ligera',pt:'chuva leve'},63:{en:'rain',es:'lluvia',pt:'chuva'},65:{en:'heavy rain',es:'lluvia intensa',pt:'chuva forte'},
  80:{en:'rain showers',es:'chubascos',pt:'aguaceiros'},81:{en:'rain showers',es:'chubascos',pt:'aguaceiros'},82:{en:'heavy showers',es:'chubascos intensos',pt:'aguaceiros fortes'},
  95:{en:'thunderstorm',es:'tormenta',pt:'trovoada'},96:{en:'thunderstorm',es:'tormenta',pt:'trovoada'},99:{en:'thunderstorm',es:'tormenta',pt:'trovoada'}
};
function wxDescription(code){ const e = wxCodeMap[code] || wxCodeMap[3]; return e[currentLang] || e.en; }

/* ---------------- State ---------------- */
let currentUser = null;
let weatherData = null;
let currentDay = todayDay();
let menuOpen = false;

function todayDay() {
  const iso = new Date().toISOString().slice(0,10);
  if (iso === "2026-09-12") return "sat";
  if (iso === "2026-09-13") return "sun";
  return "fri";
}

function getCookie(name){ const m = document.cookie.match('(?:^|; )' + name + '=([^;]*)'); return m ? decodeURIComponent(m[1]) : null; }
function setCookie(name, value, days){ document.cookie = name + '=' + encodeURIComponent(value) + '; max-age=' + (days*24*60*60) + '; path=/; SameSite=Lax'; }

let currentLang = getCookie('lang') || 'en';
if (!translations[currentLang]) currentLang = 'en';
function t(key){ return (translations[currentLang] && translations[currentLang][key]) || translations.en[key] || ''; }

/* ---------------- Weather ---------------- */
function fetchWeather() {
  if (weatherData) { renderDay(); return; }
  fetch('/.netlify/functions/weather')
    .then(res => res.json().then(body => ({ ok: res.ok, body })))
    .then(r => { weatherData = r.ok ? r.body : { error: true }; renderDay(); })
    .catch(() => { weatherData = { error: true }; renderDay(); });
}
function weatherLine(loc, date) {
  if (!weatherData || weatherData.error || !weatherData[loc] || !weatherData[loc][date]) return t('weatherUnavailable');
  const d = weatherData[loc][date];
  return d.max + '°/' + d.min + '°C, ' + wxDescription(d.code) + ' · ' + d.rain + '% ' + t('rainLabel');
}

/* ---------------- Language & menu ---------------- */
function changeLang(lang) {
  if (!translations[lang]) return;
  currentLang = lang;
  setCookie('lang', lang, 365);
  document.documentElement.lang = lang;
  document.title = t('pageTitle');
  menuOpen = false;
  if (document.getElementById('hubPage').classList.contains('active')) {
    applyHubTranslations(); renderDay();
  } else {
    applyWelcomeTranslations();
  }
}
function toggleMenu() { menuOpen = !menuOpen; document.getElementById('menuPanel').classList.toggle('open', menuOpen); }
document.addEventListener('click', function(e) {
  const wrap = document.querySelector('.menu-wrap');
  if (wrap && !wrap.contains(e.target) && menuOpen) { menuOpen = false; document.getElementById('menuPanel').classList.remove('open'); }
});

function applyWelcomeTranslations() {
  document.getElementById('welcomeKicker').textContent = t('weddingKicker');
  document.getElementById('welcomeAmp').textContent = t('amp');
  document.getElementById('passwordLabel').textContent = t('passwordLabel');
  document.getElementById('passwordInp').placeholder = t('passwordPlaceholder');
  document.getElementById('langHint').textContent = t('langHint');
  const btn = document.getElementById('loginBtn');
  if (!btn.disabled) btn.textContent = t('loginBtn');
  document.getElementById('loginErr').style.display = 'none';
  document.querySelectorAll('.lang-pill').forEach(el => el.classList.toggle('active', el.dataset.lang === currentLang));
}
function applyHubTranslations() {
  document.getElementById('hubLogoutBtn').textContent = t('logout');
  document.getElementById('menuLangLabel').textContent = currentLang.toUpperCase();
  document.querySelector('[data-day="fri"]').textContent = t('tabFri');
  document.querySelector('[data-day="sat"]').textContent = t('tabSat');
  document.querySelector('[data-day="sun"]').textContent = t('tabSun');
  document.getElementById('tabExtraBtn').textContent = t('tabExtra');
  document.getElementById('dayTitleExtra').textContent = t('tabExtra');
  document.querySelectorAll('.menu-item[data-lang]').forEach(el => el.classList.toggle('active', el.dataset.lang === currentLang));
}

/* ---------------- Day tabs ---------------- */
function setDay(day) { currentDay = day; renderDay(); }

function renderDay() {
  document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.dataset.day === currentDay));
  document.getElementById('dayHeaderExtra').style.display = currentDay === 'extra' ? '' : 'none';
  document.getElementById('dayHeaderNormal').style.display = currentDay === 'extra' ? 'none' : '';

  const c = document.getElementById('dayContent');

  if (currentDay === 'extra') {
    c.innerHTML =
      '<div class="day-panel">' +
        '<div class="card qr-card"><div class="card-head center"><div class="dot"></div><div class="card-head-title">' + t('guestbookHeading') + '</div></div>' +
          '<div class="qr-body"><div class="qr-note">' + t('guestbookNote') + '</div>' +
          '<img class="qr-img" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=8&color=551C25&bgcolor=FCF8F0&data=' + encodeURIComponent(GUESTBOOK_URL) + '" alt="Guest book QR code">' +
          '<a class="qr-link" href="' + GUESTBOOK_URL + '" target="_blank" rel="noopener">' + GUESTBOOK_URL.replace(/^https?:\/\//,'') + '</a></div></div>' +
        '<div class="card qr-card"><div class="card-head center"><div class="dot"></div><div class="card-head-title">' + t('giftfundHeading') + '</div></div>' +
          '<div class="qr-body"><div class="qr-note">' + t('giftfundNote') + '</div>' +
          '<img class="qr-img" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=8&color=551C25&bgcolor=FCF8F0&data=' + encodeURIComponent(GIFTFUND_URL) + '" alt="Gift fund QR code">' +
          '<a class="qr-link" href="' + GIFTFUND_URL + '" target="_blank" rel="noopener">' + GIFTFUND_URL.replace(/^https?:\/\//,'') + '</a></div></div>' +
      '</div>' + footerCard();
    return;
  }

  document.getElementById('dayTitle').textContent = t('dayName' + capitalize(currentDay));
  document.getElementById('daySub').textContent = t('dayDate' + capitalize(currentDay)) + ' · ' + (currentDay === 'sun' ? weatherLine('torremolinos','2026-09-13') : weatherLine('malaga', currentDay === 'fri' ? '2026-09-11' : '2026-09-12'));

  function rail(rows) {
    return rows.map((r, i) => (
      '<div class="rail-row"><div class="rail-time">' + r[0] + '</div>' +
      '<div class="rail-line' + (i === rows.length - 1 ? ' last' : '') + '"><div class="rail-line-dot"></div></div>' +
      '<div class="rail-text' + (i === rows.length - 1 ? ' last' : '') + '">' + r[1] + '</div></div>'
    )).join('');
  }
  function fields(rows) {
    return '<div class="fields">' + rows.map(r => '<div><div class="field-label">' + r[0] + '</div><div class="field-value">' + r[1] + '</div></div>').join('') + '</div>';
  }
  function card(headingKey, railRows, fieldRows) {
    return '<div class="card"><div class="card-head"><div class="dot"></div><div class="card-head-title">' + t(headingKey) + '</div></div>' +
      '<div class="rail"><div class="rail-label">' + t('scheduleLabel') + '</div>' + rail(railRows) + '</div>' + fields(fieldRows) + '</div>';
  }

  let html = '<div class="day-panel">';
  if (currentDay === 'fri') {
    html += card('ceremonyHeading', [['17:30', t('fri_c1')], ['18:15', t('fri_c2')]], [
      [t('locationLabel'), '<a href="https://www.google.com/maps/search/?api=1&query=Iglesia+de+San+Juan+Malaga" target="_blank" rel="noopener">Iglesia de San Juan</a>, ' + t('fri_c_loc')],
      [t('transportLabel'), t('fri_c_transport')],
      [t('dressLabel'), t('fri_c_dress')]
    ]);
    html += card('receptionHeading', [['19:00', t('fri_r1')], ['19:15', t('fri_r2')], ['20:30', t('fri_r3')], ['22:45', t('fri_r4')], ['01:15', t('fri_r5')], ['03:00', t('fri_r6')]], [
      [t('locationLabel'), '<a href="https://www.google.com/maps/search/?api=1&query=Hacienda+Nadales+Camino+de+Casabermeja+128+Malaga" target="_blank" rel="noopener">Hacienda Nadales</a>, ' + t('fri_r_loc')],
      [t('transportLabel'), t('fri_r_transport')],
      [t('dressLabel'), t('fri_r_dress')]
    ]);
  } else if (currentDay === 'sat') {
    html += card('drinksHeading', [['15:00', t('sat_1')], ['17:00', t('sat_2')]], [
      [t('locationLabel'), '<a href="https://www.google.com/maps/search/?api=1&query=Trocadero+Casa+de+Botes+Paseo+de+la+Farola+25+Malaga" target="_blank" rel="noopener">Trocadero Casa de Botes</a>, ' + t('sat_loc')],
      [t('transportLabel'), t('sat_transport')],
      [t('dressLabel'), t('sat_dress')]
    ]);
  } else if (currentDay === 'sun') {
    html += card('beachHeading', [['13:00', t('sun_1')]], [
      [t('locationLabel'), '<a href="https://www.google.com/maps/search/?api=1&query=La+Playa+Surf+House+Torremolinos" target="_blank" rel="noopener">La Playa Surf House</a>, ' + t('sun_loc')],
      [t('transportLabel'), t('sun_transport')],
      [t('dressLabel'), t('sun_dress')]
    ]);
  }
  html += '</div>';
  html += footerCard();
  c.innerHTML = html;
}
function capitalize(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

function footerCard() {
  return '<div class="footer-card"><div class="footer-inner"><div>' +
    '<div class="footer-label">' + t('questionsLabel') + '</div>' +
    '<div class="footer-name">' + t('coordinatorName') + '</div>' +
    '<div class="footer-role">' + t('coordinatorRole') + '</div></div>' +
    '<div class="footer-actions">' +
      '<a href="tel:+34666891100" class="call-btn">' + t('callBtn') + '</a>' +
      '<a href="https://wa.me/34666891100" target="_blank" rel="noopener" class="call-btn">' + t('whatsappBtn') + '</a>' +
    '</div></div></div>';
}

/* ---------------- Routing / auth (unchanged from original site) ---------------- */
function navigate(path) { window.history.pushState({}, '', path); render(); }

function showWelcome() {
  document.getElementById('welcomePage').classList.add('active');
  document.getElementById('hubPage').classList.remove('active');
  applyWelcomeTranslations();
  setTimeout(() => { const p = document.getElementById('passwordInp'); if (p) { p.value=''; p.focus(); } }, 0);
}

function render() {
  const path = window.location.pathname;
  document.getElementById('welcomePage').classList.remove('active');
  document.getElementById('hubPage').classList.remove('active');
  if (path === '/' || path === '') { showWelcome(); return; }
  if (path === '/hub') {
    const token = sessionStorage.getItem('auth_token');
    if (!token) { navigate('/'); return; }
    fetch('/.netlify/functions/verify', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ token }) })
      .then(res => { if (!res.ok) throw new Error('invalid'); return res.json(); })
      .then(data => {
        if (!data.valid) throw new Error('invalid');
        document.getElementById('hubPage').classList.add('active');
        document.title = t('pageTitle');
        applyHubTranslations();
        currentDay = todayDay();
        renderDay();
        fetchWeather();
      })
      .catch(() => { sessionStorage.removeItem('auth_token'); navigate('/'); });
    return;
  }
  navigate('/');
}

function tryLogin() {
  const pass = document.getElementById('passwordInp').value.trim();
  const err = document.getElementById('loginErr');
  const btn = document.getElementById('loginBtn');
  if (!pass) { err.textContent = t('errPasswordRequired'); err.style.display='block'; return; }
  const originalText = t('loginBtn');
  btn.textContent = t('loggingIn'); btn.disabled = true;
  fetch('/.netlify/functions/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: pass }) })
    .then(res => res.json())
    .then(data => {
      if (data.token) {
        sessionStorage.setItem('auth_token', data.token);
        currentUser = 'guest'; err.style.display='none';
        navigate('/hub');
      } else {
        err.textContent = t('errAuthFailed'); err.style.display='block';
        btn.textContent = originalText; btn.disabled = false;
      }
    })
    .catch(() => { err.textContent = t('errConnection'); err.style.display='block'; btn.textContent = originalText; btn.disabled = false; });
}

function logout() { currentUser = null; sessionStorage.removeItem('auth_token'); navigate('/'); }

document.addEventListener('DOMContentLoaded', function() {
  document.documentElement.lang = currentLang;
  document.title = t('pageTitle');
  document.querySelectorAll('.lang-pill').forEach(el => el.classList.toggle('active', el.dataset.lang === currentLang));
  window.addEventListener('popstate', render);
  render();
});
document.addEventListener('keypress', function(e) { if (e.target.id === 'passwordInp' && e.key === 'Enter') tryLogin(); });
</script>
</body>
</html>
